name: Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            platform_name: Windows
          - os: ubuntu-latest
            platform_name: Linux
          - os: macos-latest
            platform_name: macOS

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup ccache
      if: matrix.os != 'windows-latest'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-

    - name: Set up .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'desktop'
        arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || '' }}
        install-deps: 'true'
        modules: 'qtcharts qtwebengine'
        cache: 'true'

    - name: Setup MSVC (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # --- Сборка CppGen (C#) ---
    
    - name: Upgrade to .NET 8 and Build CppGen
      shell: bash
      run: |
        # Патчим версию .NET на 8.0 через Python (работает везде)
        python -c "p='CppGen/CppGen/CppGen.csproj'; d=open(p).read(); open(p,'w').write(d.replace('net6.0','net8.0'))"
        
        # ФИКС: Собираем именно .csproj, а не .sln. Это решает ошибку конфигурации Release|x64 на Windows
        dotnet build CppGen/CppGen/CppGen.csproj -c Release

    - name: Run CppGen
      shell: bash
      run: |
        # Копируем gml.json прямо в папку с готовым exe/dll
        mkdir -p CppGen/CppGen/bin/Release/net8.0/
        cp CppGen/gml.json CppGen/CppGen/bin/Release/net8.0/
        
        # Запускаем DLL напрямую
        dotnet CppGen/CppGen/bin/Release/net8.0/CppGen.dll -game "GmProject" -cpp "CppProject"

    # --- Сборка проекта (C++) ---

    - name: Configure CMake
      run: |
        if [ "${{ matrix.os }}" != "windows-latest" ]; then
          export CC="ccache gcc"
          export CXX="ccache g++"
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
             export CC="ccache clang"
             export CXX="ccache clang++"
          fi
        fi
        cmake -S CppProject -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build with CMake
      run: |
        cmake --build build --config Release

    # --- Упаковка ---

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        mkdir release_dist
        copy build\Release\*.exe release_dist\
        xcopy /E /I GmProject\datafiles\Data release_dist\Data
        windeployqt release_dist\*.exe --release --no-translations --no-system-d3d-compiler --no-compiler-runtime --no-opengl-sw

    - name: Package (Unix - Mac/Linux)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        mkdir release_dist
        find build -type f -perm +111 -not -name ".*" -exec cp {} release_dist/ \; || find build -type f -perm /111 -not -name ".*" -exec cp {} release_dist/ \;
        if [ -d "GmProject/datafiles/Data" ]; then
          cp -r GmProject/datafiles/Data release_dist/
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mine-imator-${{ matrix.platform_name }}
        path: release_dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts
        run: |
          cd artifacts
          for dir in */; do
              platform=${dir%*/}
              zip -r "../$platform.zip" "$platform"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          files: artifacts/*.zip
          draft: false
          prerelease: false