name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qttools5-dev qt5-qmake libopenal-dev libfreetype-dev libzip-dev libavcodec-dev libavformat-dev libswscale-dev libavutil-dev libswresample-dev libvdpau-dev libva-dev libsndio-dev libx264-dev libgnutls28-dev nettle-dev libx11-dev liblzma-dev

      - name: Build
        run: |
          mkdir Build
          cd Build
          cmake -DDEV_DIR=$HOME/Dev -DQT_VERSION=5.15.9 ../CppProject
          cmake --build . --config Release -j$(nproc)

      - name: Package
        run: |
          mkdir -p Release
          cp Build/Mine-imator Release/
          cp -r GmProject/datafiles/* Release/

          cd Release
          tar -czvf ../Mine-imator-Linux.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mine-imator-Linux
          path: Mine-imator-Linux.tar.gz

  build-windows:
    runs-on: windows-2022
    env:
      DEV_DIR: C:\Dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment Variables
        run: |
          echo "DEV_DIR=C:\Dev" >> $env:GITHUB_ENV
          echo "C:\Dev\bin" >> $env:GITHUB_PATH

      - name: Create Directories
        run: |
          New-Item -ItemType Directory -Force -Path C:\Dev
          New-Item -ItemType Directory -Force -Path C:\Dev\OpenSSL

      - name: Restore Qt Cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: C:\Dev
          key: ${{ runner.os }}-qt-5.15.9-static-v2
          restore-keys: |
            ${{ runner.os }}-qt-5.15.9-static-

      - name: Install Tools (NASM, Perl)
        run: |
          choco install nasm strawberryperl -y

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Run Setup Dependencies
        shell: powershell
        run: |
          # Patch setup_environment.ps1 to skip winget since we installed tools via choco/actions
          (Get-Content ./DOP/setup_environment.ps1) -replace 'winget install', '# winget install' | Set-Content ./DOP/setup_environment.ps1

          # Run the script to set env vars and create folders
          ./DOP/setup_environment.ps1

      - name: Install Jom and Qt (Manual)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          # 1. Download Jom
          $jomUrl = "http://download.qt.io/official_releases/jom/jom_1_1_3.zip"
          $jomDest = "C:\Dev\Jom"
          if (-not (Test-Path "$jomDest\jom.exe")) {
              New-Item -ItemType Directory -Force -Path $jomDest
              Invoke-WebRequest -Uri $jomUrl -OutFile "jom.zip"
              Expand-Archive "jom.zip" -DestinationPath $jomDest
          }

          # 2. Clone Qt 5.15.9 (using 5.15.2 tag as base or specific branch)
          $qtDir = "C:\Dev\Qt\5.15.9"
          New-Item -ItemType Directory -Force -Path "C:\Dev\Qt"
          if (-not (Test-Path "$qtDir\configure.bat")) {
              git clone https://code.qt.io/qt/qt5.git $qtDir
              Set-Location $qtDir
              git checkout 5.15
              perl init-repository --module-subset=default,-qtwebengine
          }

      # OpenSSL steps removed as we are building without SSL support

      - name: Setup Headers and Libs (Manual)
        shell: powershell
        run: |
          # Replace setup_headers.ps1 to avoid timeouts and errors with tar
          $devDir = "C:\Dev"

          function Install-Lib($name, $url, $dest, $archiveName) {
             if (-not (Test-Path $dest)) {
                 Write-Host "Downloading $name..."
                 Invoke-WebRequest -Uri $url -OutFile $archiveName
                 Write-Host "Extracting $name..."
                 7z x $archiveName -o"$devDir" -y
                 if ($archiveName -like "*.tar*") {
                     if ($archiveName -like "*.tar") {
                        $tarName = $archiveName
                     } else {
                        $tarName = $archiveName.Substring(0, $archiveName.LastIndexOf('.'))
                        # The extracted tar is in devDir
                        7z x "$devDir\$tarName" -o"$devDir" -y
                     }
                 }
             }
          }

          # OpenAL
          Install-Lib "OpenAL" "https://openal-soft.org/openal-releases/openal-soft-1.22.0.tar.bz2" "$devDir\openal-soft-1.22.0" "openal.tar.bz2"
          if (Test-Path "$devDir\openal-soft-1.22.0") { Rename-Item "$devDir\openal-soft-1.22.0" "$devDir\OpenAL" }

          # Libzip
          Install-Lib "Libzip" "https://libzip.org/download/libzip-1.9.2.tar.gz" "$devDir\libzip-1.9.2" "libzip.tar.gz"
          if (Test-Path "$devDir\libzip-1.9.2") { Rename-Item "$devDir\libzip-1.9.2" "$devDir\Libzip" }

          # FreeType
          Install-Lib "FreeType" "https://download.savannah.gnu.org/releases/freetype/freetype-2.9.1.tar.gz" "$devDir\freetype-2.9.1" "freetype.tar.gz"
          if (Test-Path "$devDir\freetype-2.9.1") { Rename-Item "$devDir\freetype-2.9.1" "$devDir\FreeType" }

          # FFmpeg
          Install-Lib "FFmpeg" "https://www.ffmpeg.org/releases/ffmpeg-5.0.tar.xz" "$devDir\ffmpeg-5.0" "ffmpeg.tar.xz"
          if (Test-Path "$devDir\ffmpeg-5.0") { Rename-Item "$devDir\ffmpeg-5.0" "$devDir\FFmpeg" }

          # Run fix_headers.ps1
          ./DOP/fix_headers.ps1

      - name: Compile Qt (If not cached)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd C:\Dev\Qt\5.15.9
          # Configure command modified to remove OpenSSL dependency
          configure.bat -platform win32-msvc -prefix "C:/Dev/Qt/5.15.9/build" -opensource -confirm-license -release -static -static-runtime -qt-libjpeg -opengl desktop -no-openssl -no-icu -nomake tests -nomake examples -nomake tools -skip qt3d -skip qtmultimedia -skip activeqt -skip qtandroidextras -skip qtconnectivity -skip datavis3d -skip qtdoc -skip gamepad -skip qtgraphicaleffects -skip qtcharts -skip qtlocation -skip qtlottie -skip qtnetworkauth -skip qtpurchasing -skip qtquick3d -skip qtquickcontrols -skip qtquickcontrols2 -skip qtquicktimeline -skip qtremoteobjects -skip qtscxml -skip qtsensors -skip qtserialbus -skip qtserialport -skip qtspeech -skip qtvirtualkeyboard -skip qtwayland -skip qtwebengine -skip qtwebglplugin -skip qtwebchannel -skip qtwebsockets -skip qtwebview -skip qtxmlpatterns
          C:\Dev\Jom\jom.exe
          C:\Dev\Jom\jom.exe install

      - name: Build Mine-imator
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir Build
          cd Build
          cmake -G "Visual Studio 17 2022" -A x64 ../CppProject
          cmake --build . --config Release

      - name: Save Qt Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Dev
          key: ${{ runner.os }}-qt-5.15.9-static-v2

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path Release
          Copy-Item "Build/Release/Mine-imator.exe" -Destination "Release/"
          Copy-Item -Recurse "GmProject/datafiles/*" -Destination "Release/"
          Compress-Archive -Path "Release/*" -DestinationPath "Mine-imator-Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mine-imator-Windows
          path: Mine-imator-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install qt@5 ffmpeg libzip freetype openal-soft cmake libomp
          brew link qt@5 --force

      - name: Build
        run: |
          mkdir Build
          cd Build
          # Fix for Qt5 mkspecs missing path issue by symlinking or correcting path if needed.
          # But simpler: set Qt5_DIR to the lib/cmake/Qt5 folder which should be enough.
          # brew install qt@5 puts it in /opt/homebrew/opt/qt@5/lib/cmake/Qt5 usually.

          # Workaround for "references the file .../mkspecs/macx-clang but this file does not exist"
          # This happens because Homebrew might clean up or symlink weirdly.
          # We can try to symlink the mkspecs folder if it's missing in the expected location.

          QT_PREFIX=$(brew --prefix qt@5)
          echo "Qt Prefix: $QT_PREFIX"
          # Try to find mkspecs anywhere in the prefix
          MKSPECS_DIR=$(find "$QT_PREFIX" -name "mkspecs" -type d | head -n 1)
          if [ -z "$MKSPECS_DIR" ]; then
             echo "mkspecs not found in $QT_PREFIX, searching global homebrew"
             MKSPECS_DIR=$(find /opt/homebrew -name "mkspecs" -type d 2>/dev/null | grep "qt" | head -n 1)
          fi

          if [ -n "$MKSPECS_DIR" ]; then
             echo "Found mkspecs at $MKSPECS_DIR"
             if [ ! -d "$QT_PREFIX/mkspecs" ]; then
                 ln -s "$MKSPECS_DIR" "$QT_PREFIX/mkspecs"
                 echo "Symlinked $MKSPECS_DIR to $QT_PREFIX/mkspecs"
             fi
             # Also symlink to /opt/homebrew/mkspecs as CMake seems to look there based on error log
             if [ ! -d "/opt/homebrew/mkspecs" ]; then
                 sudo ln -s "$MKSPECS_DIR" "/opt/homebrew/mkspecs"
                 echo "Symlinked $MKSPECS_DIR to /opt/homebrew/mkspecs"
             fi
          else
             echo "CRITICAL: mkspecs not found!"
             exit 1
          fi

          # Workaround for Qt5GuiConfig.cmake expecting plugins in /opt/homebrew/plugins
          # Similar to mkspecs, find plugins directory and symlink
          PLUGINS_DIR=$(find "$QT_PREFIX" -name "plugins" -type d | head -n 1)
          if [ -z "$PLUGINS_DIR" ]; then
             PLUGINS_DIR=$(find /opt/homebrew -name "plugins" -type d 2>/dev/null | grep "qt" | head -n 1)
          fi

          if [ -n "$PLUGINS_DIR" ]; then
             echo "Found plugins at $PLUGINS_DIR"
             if [ ! -d "/opt/homebrew/plugins" ]; then
                 sudo ln -s "$PLUGINS_DIR" "/opt/homebrew/plugins"
                 echo "Symlinked $PLUGINS_DIR to /opt/homebrew/plugins"
             fi
          fi

          # Need to point CMake to brew installed Qt and libs and OpenMP
          # Explicitly add OpenAL include dir
          cmake -DDEV_DIR=$HOME/Dev -DQT_VERSION=5.15.9 -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5);$(brew --prefix libomp);$(brew --prefix openal-soft)" -DOpenMP_ROOT=$(brew --prefix libomp) -DCMAKE_CXX_FLAGS="-I$(brew --prefix openal-soft)/include" ../CppProject
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir Release
          cp Build/Mine-imator Release/
          cp -r GmProject/datafiles/* Release/
          tar -czvf Mine-imator-macOS.tar.gz Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mine-imator-macOS
          path: Mine-imator-macOS.tar.gz

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Mine-imator-Linux/Mine-imator-Linux.tar.gz
            artifacts/Mine-imator-Windows/Mine-imator-Windows.zip
            artifacts/Mine-imator-macOS/Mine-imator-macOS.tar.gz
