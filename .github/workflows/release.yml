name: Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            platform_name: Windows
            shell: cmd
          - os: ubuntu-latest
            platform_name: Linux
            shell: bash
          - os: macos-latest
            platform_name: macOS
            shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # На случай, если есть сабмодули

    # --- Кэширование (Ускорение сборки) ---
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Для C++ кэш (ccache) сильно ускоряет повторные сборки на Linux/Mac
    - name: Setup ccache
      if: matrix.os != 'windows-latest'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: ${{ runner.os }}-ccache-

    # --- Настройка окружения ---
    
    # ФИКС ОШИБКИ: Явно устанавливаем .NET 6.0, так как его нет в новых образах
    - name: Set up .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x' 

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: ${{ matrix.platform_name }}
        target: 'desktop'
        # Для Windows нужен конкретный архив, для остальных авто
        arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || '' }}
        install-deps: 'true'
        modules: 'qtcharts qtwebengine'
        cache: 'true' # Этот экшен сам умеет кэшировать Qt

    - name: Setup MSVC (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # --- Сборка генератора кода (C#) ---
    
    - name: Build CppGen
      run: |
        dotnet build CppGen/CppGen.sln -c Release

    - name: Run CppGen
      shell: bash
      run: |
        # Используем dotnet run для кроссплатформенности, это надежнее поиска exe
        # -- указывает, что дальше идут аргументы самой программы
        dotnet run --project CppGen/CppGen/CppGen.csproj -c Release -- -game "GmProject" -cpp "CppProject"

    # --- Сборка проекта (C++) ---

    - name: Configure CMake
      run: |
        # Добавляем флаги для ccache, если это не Windows
        if [ "${{ matrix.os }}" != "windows-latest" ]; then
          export CC="ccache gcc"
          export CXX="ccache g++"
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
             export CC="ccache clang"
             export CXX="ccache clang++"
          fi
        fi
        cmake -S CppProject -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build with CMake
      run: |
        cmake --build build --config Release

    # --- Упаковка ---

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        mkdir release_dist
        copy build\Release\*.exe release_dist\
        xcopy /E /I GmProject\datafiles\Data release_dist\Data
        
        :: Деплой DLL для Qt
        windeployqt release_dist\*.exe --release --no-translations --no-system-d3d-compiler --no-compiler-runtime --no-opengl-sw

    - name: Package (Unix - Mac/Linux)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        mkdir release_dist
        # Находим и копируем бинарник
        find build -type f -perm +111 -not -name ".*" -exec cp {} release_dist/ \; || find build -type f -perm /111 -not -name ".*" -exec cp {} release_dist/ \;
        
        # Копируем данные
        if [ -d "GmProject/datafiles/Data" ]; then
          cp -r GmProject/datafiles/Data release_dist/
        fi
        
        # Для Mac часто нужен macdeployqt, но пока оставим просто копирование
        # Если билд упадет на запуске, сюда нужно добавить вызов macdeployqt

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mine-imator-${{ matrix.platform_name }}
        path: release_dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/') # Срабатывает на пуш в ветку
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts
        run: |
          # Пакуем папки в zip архивы для релиза
          cd artifacts
          for dir in */; do
              platform=${dir%*/}
              zip -r "../$platform.zip" "$platform"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          files: artifacts/*.zip
          draft: false
          prerelease: false